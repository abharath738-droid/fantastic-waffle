<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stackly | Sign Up</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="container navbar"><a class="logo" href="index.html">Stackly</a><button class="menu-toggle">☰</button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="services.html">Services</a></li><li><a class="nav-link" href="about.html">About</a></li><li><a class="nav-link" href="contact.html">Contact</a></li></ul><div class="nav-actions" id="userArea"></div></div></header>
<main class="auth-section"><div class="container"><h1 class="section-title">Create Account</h1><form id="signupForm" class="form-card" novalidate><div class="form-group"><label for="signupName">Name</label><input id="signupName" type="text"><div id="signupNameError" class="error"></div></div><div class="form-group"><label for="signupEmail">Email</label><input id="signupEmail" type="email"><div id="signupEmailError" class="error"></div></div><div class="form-group input-wrap"><label for="signupPassword">Password</label><input id="signupPassword" type="password"><button class="password-toggle" type="button" data-toggle-password="signupPassword">Show</button><div id="signupPasswordError" class="error"></div></div><div class="form-group input-wrap"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password"><button class="password-toggle" type="button" data-toggle-password="confirmPassword">Show</button><div id="confirmPasswordError" class="error"></div></div><button class="btn btn-primary" type="submit">Sign Up</button></form></div></main>
<footer class="site-footer"><div class="container footer-content"><div><h3>Stackly</h3><p>Modern software engineering for ambitious companies.</p></div><div><div class="socials"><a href="#">LinkedIn</a><a href="#">X</a><a href="#">GitHub</a></div><p>© 2026 Stackly. All rights reserved.</p></div></div></footer><script src="script.js"></script></body></html>
